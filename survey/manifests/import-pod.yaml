apiVersion: v1
kind: Pod
metadata:
  name: jfs-import
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: importer
      image: juicedata/mount:ce-v1.3.0
      imagePullPolicy: IfNotPresent
      env:
        - name: myfs
          value: redis://redis.default.svc.cluster.local:6379/0
        - name: MINIO_ACCESS_KEY
          value: "traincache"
        - name: MINIO_SECRET_KEY
          value: "traincache-probe"
      command:
        - sh
        - -c
        - |
          set -e
          echo "=== 开始同步 ==="
          juicefs sync \
            "minio://minio.minio.svc.cluster.local:9000/train-data/" \
            "jfs://myfs/" \
            --threads 8
          echo "=== 校验 ==="
          juicefs sync "jfs://myfs/" "file:///tmp/check/"
          find /tmp/check -type f | head -30
          du -sh /tmp/check