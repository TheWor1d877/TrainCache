# 把 MinIO 裸对象(16 个 tar)导入 JuiceFS 文件系统 —— jfs:// 直写方案
#
# 原理:JuiceFS 有独立元数据层(redis),裸 S3 对象不会被文件系统自动看到。
# 本 Pod 不挂载任何 PVC(Fluid 的 PVC 是只读的,写不进去),
# 而是用 juicefs sync 的 jfs:// 协议直写文件系统(官方推荐,绕过 FUSE):
#   源   = MinIO 裸对象(minio:// 路径式 URI:AK:SK@endpoint/bucket)
#   目标 = jfs://myfs/(myfs 是环境变量名,值为 redis 元数据 URL)
# 对象存储凭证在 format 时已加密存入元数据,无需在此重复提供。
apiVersion: v1
kind: Pod
metadata:
  name: jfs-import
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: importer
      image: juicedata/mount:ce-v1.3.0
      imagePullPolicy: IfNotPresent
      env:
        - name: myfs
          value: redis://redis.default.svc.cluster.local:6379/0
      command:
        - sh
        - -c
        - |
          set -e
          echo "=== 开始同步:MinIO 裸对象 → JuiceFS 文件系统 ==="
          juicefs sync \
            "minio://traincache:traincache-probe@minio.minio.svc.cluster.local:9000/train-data" \
            "jfs://myfs/" \
            --threads 8 --buffer-size 64
          echo "=== 导入完成,校验文件系统内容 ==="
          juicefs ls "jfs://myfs/"
