# Fluid JuiceFSRuntime:与 Dataset 同名即自动绑定;管理缓存 worker 与 FUSE
# tieredstore 用内存缓存(数据 2GB;配额 1Gi 故意欠配:16×126MB 无法全驻留,
# 三 epoch 换序读时每次切换必产生 miss 落地 UFS,才能观测"是否主动预热";
# 原 3Gi 会把切换点全命中、UFS 零流量,无从观测。换 SSD 层改 mediumtype/path)
apiVersion: data.fluid.io/v1alpha1
kind: JuiceFSRuntime
metadata:
  name: jfsdemo #metadata.name 必须和 Dataset 同名。Fluid 的 controller 就是靠"名字相同"来把 Runtime 和 Dataset 配对绑定的。
  namespace: default
spec:
  replicas: 1
  tieredstore:
    levels:
      - mediumtype: MEM
        path: /dev/shm
        quota: 1Gi
        low: "0.1"
