# JuiceFS 社区版凭证:元数据引擎(redis)+ 对象存储(MinIO)参数
# metaurl 指向 kind 内 redis Service;bucket 用集群内 MinIO Service 地址
apiVersion: v1
kind: Secret
metadata:
  name: jfs-secret
  namespace: default
type: Opaque
stringData:
  name: traincache-demo
  metaurl: redis://redis.default.svc.cluster.local:6379/0
  storage: minio
  bucket: http://minio.minio.svc.cluster.local:9000/train-data
  access-key: traincache
  secret-key: traincache-probe
