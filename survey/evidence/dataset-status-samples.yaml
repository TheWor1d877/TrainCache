# ============================================================
# 对手阶段感知现勘:Dataset jfsdemo status 多时间点采样
# 采样命令: kubectl get dataset jfsdemo -o yaml | sed -n '/^status:/,$p'
# 采样周期: 10s;每段前以 "# ---- sample <ISO8601_UTC> uptime=<host秒> ----" 分隔
# 关键字段: status.cacheStates.{cached,cachedPercentage,cacheCapacity,cacheHitRatio}
#           status.fileNum / status.ufsTotal / status.conditions[].lastUpdateTime
# 判读: ②缓存抬升点落在「Pod 读某分片之后」=被动;「先于 Pod 读」=主动
# 装置备注: 基线时 cached/cachedPercentage 为空串、fileNum=0、ufsTotal=0.00B
#           (Fluid 1.1.0-alpha.9 + JuiceFS 统计刷新滞后,观测其是否在窗口内变化)
# ============================================================
# ---- sample 2026-10-13T13:26:09Z uptime=42540.73 (基线,实验前) ----
status:
  cacheStates:
    cacheCapacity: 1.00GiB
    cacheHitRatio: ""
    cacheThroughputRatio: ""
    cached: ""
    cachedPercentage: ""
  conditions:
  - lastTransitionTime: "2026-10-13T11:45:26Z"
    lastUpdateTime: "2026-10-13T13:25:06Z"
    message: The ddc runtime is ready.
    reason: DatasetReady
    status: "True"
    type: Ready
  fileNum: "0"
  mounts:
  - encryptOptions:
    - name: metaurl
      valueFrom:
        secretKeyRef:
          key: metaurl
          name: jfs-secret
    - name: access-key
      valueFrom:
        secretKeyRef:
          key: access-key
          name: jfs-secret
    - name: secret-key
      valueFrom:
        secretKeyRef:
          key: secret-key
          name: jfs-secret
    mountPoint: juicefs:///
    name: traincache-demo
    options:
      bucket: http://minio.minio.svc.cluster.local:9000/train-data
      storage: minio
  phase: Bound
  runtimes:
  - category: Accelerate
    masterReplicas: 1
    name: jfsdemo
    namespace: default
    type: juicefs
  ufsTotal: 0.00B
