name: verify

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit + static (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [controller, core, agent]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: '**/go.sum'
      - name: verify ${{ matrix.module }}
        run: make verify-${{ matrix.module }}

  render:
    name: kustomize render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.34.1
      - name: render controller/deploy
        run: kubectl kustomize controller/deploy >/dev/null

  # 只拦 PR dev→main：版本引用与文档链接必须在合并前干净。
  metadata:
    name: release metadata
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 版本检查要读 HEAD 上的 tag
      - name: check versions and doc refs
        run: make verify-metadata

  # 门禁只认这一个名字：以后往 matrix 加模块，GitHub 保护规则不用改。
  gate:
    name: verify gate
    needs: [unit, render, metadata]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          set -euo pipefail
          for r in '${{ needs.unit.result }}' '${{ needs.render.result }}' '${{ needs.metadata.result }}'; do
            [[ "$r" == success || "$r" == skipped ]] || { echo "上游 $r，不放行" >&2; exit 1; }
          done
