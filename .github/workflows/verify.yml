name: verify

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit + static (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [controller, core, agent, gateway]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: '**/go.sum'
      - name: verify ${{ matrix.module }}
        run: make verify-${{ matrix.module }}

  # 真实 S3 兼容后端(MinIO)集成:验证条件写语义(If-Match / If-None-Match)。
  # 未设置 TC_S3_* 时 core 的普通 go test 仍会 skip 该用例,不影响 unit job。
  s3-integration:
    name: S3 integration (MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pgsty/minio 的默认命令只打印帮助就退出，不能作为 service 容器；
      # 显式给 server 子命令，与 e2e 的 MinIO 清单保持一致。
      - name: start MinIO
        run: |
          docker run -d --name minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=traincache \
            -e MINIO_ROOT_PASSWORD=traincache-probe \
            docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: '**/go.sum'
      - name: wait for MinIO
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "MinIO 未在 120s 内就绪" >&2
          exit 1
      - name: create bucket
        working-directory: controller
        run: >-
          go run ./e2e/mkbucket
          --endpoint 127.0.0.1:9000
          --access-key traincache
          --secret-key traincache-probe
          --bucket traincache
      - name: go test ./objectstore -run TestS3
        working-directory: core
        env:
          TC_S3_ENDPOINT: 127.0.0.1:9000
          TC_S3_ACCESS_KEY: traincache
          TC_S3_SECRET_KEY: traincache-probe
          TC_S3_BUCKET: traincache
        run: go test ./objectstore -run TestS3 -count=1

  render:
    name: kustomize render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.34.1
      - name: render controller/deploy
        run: kubectl kustomize controller/deploy >/dev/null

  # 只拦 PR dev→main：版本引用与文档链接必须在合并前干净。
  metadata:
    name: release metadata
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 版本检查要读 HEAD 上的 tag
      - name: check versions and doc refs
        run: make verify-metadata

  # 门禁只认这一个名字：以后往 matrix 加模块，GitHub 保护规则不用改。
  gate:
    name: verify gate
    needs: [unit, s3-integration, render, metadata]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          set -euo pipefail
          for r in '${{ needs.unit.result }}' '${{ needs.s3-integration.result }}' '${{ needs.render.result }}' '${{ needs.metadata.result }}'; do
            [[ "$r" == success || "$r" == skipped ]] || { echo "上游 $r，不放行" >&2; exit 1; }
          done
