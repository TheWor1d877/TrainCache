name: release

# 发版唯一入口：push vX.Y.Z tag。CI 不创建 tag，版本号只来自 tag。
on:
  push:
    tags: ['v*']

permissions:
  contents: write    # 建 Release、传附件
  packages: write    # 推 GHCR

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: build, render, publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 版本检查要读 tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: '**/go.sum'

      - name: verify versions
        env:
          TAG: ${{ github.ref_name }}
        run: make verify-metadata

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push images
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REG=ghcr.io/thewor1d877/traincache
          while IFS='|' read -r comp dockerfile var; do
            img="$REG/$comp"
            docker build -f "$dockerfile" --build-arg VERSION="$TAG" -t "$img:$TAG" .
            docker push "$img:$TAG"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$img:$TAG" | sed 's/.*@//')"
            [[ "$digest" == sha256:* ]] || { echo "no digest for $img" >&2; exit 1; }
            echo "$var=$digest" >>"$GITHUB_ENV"
            echo "$img:$TAG -> $digest"
          done <<'IMAGES'
          controller-manager|controller/deploy/manager/Dockerfile|D_MANAGER
          webhook|controller/deploy/webhook/Dockerfile|D_WEBHOOK
          kube-scheduler|controller/deploy/scheduler/Dockerfile|D_SCHEDULER
          traincache-agentd|agent/Dockerfile|D_AGENT
          IMAGES

      - name: render install.yaml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ./hack/render-install.sh "$TAG" \
            "$D_MANAGER" "$D_WEBHOOK" "$D_SCHEDULER" "$D_AGENT" install.yaml

      - name: build cli
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd agent && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o ../traincache-linux-amd64 ./cmd/traincache)
          (cd core && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o ../trainpublish-linux-amd64 ./cmd/trainpublish)
          file traincache-linux-amd64 trainpublish-linux-amd64

      - name: pack images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REG=ghcr.io/thewor1d877/traincache
          docker save -o "traincache-${TAG}-images.tar" \
            "$REG/controller-manager:$TAG" \
            "$REG/webhook:$TAG" \
            "$REG/kube-scheduler:$TAG" \
            "$REG/traincache-agentd:$TAG"
          sha256sum install.yaml "traincache-${TAG}-images.tar" \
            traincache-linux-amd64 trainpublish-linux-amd64 >SHA256SUMS

      - name: release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md >release-notes.md
          [[ -s release-notes.md ]] || { echo "CHANGELOG 没有 $TAG 正文" >&2; exit 1; }

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            install.yaml \
            "traincache-${TAG}-images.tar" \
            traincache-linux-amd64 \
            trainpublish-linux-amd64 \
            SHA256SUMS
