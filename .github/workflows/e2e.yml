name: e2e

# kind e2e 约 45 分钟，且依赖镜像拉取与节点资源，不进每个 PR。
# 两种触发：PR 贴 ci/e2e 标签；Actions 页面手动 Run workflow。
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: kind e2e
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ci/e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: '**/go.sum'
      - name: install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: run e2e
        env:
          NODE_IMAGE: docker.io/kindest/node:v1.37.0
          TRAINCACHE_DATA_ROOT: ${{ github.workspace }}/.traincachedata
        run: make e2e
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .traincachedata/controller/e2e/results/
          if-no-files-found: ignore
