name: e2e

# kind e2e 约 45 分钟，作为 dev→main 的合并门禁，每个目标 main 的 PR 自动跑。
# Actions 页面可手动 Run workflow 复跑。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: kind e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: '**/go.sum'
      - name: install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: run e2e
        env:
          NODE_IMAGE: docker.io/kindest/node:v1.37.0
          TRAINCACHE_DATA_ROOT: ${{ github.workspace }}/.traincachedata
        run: make e2e
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: .traincachedata/controller/e2e/results/
          if-no-files-found: ignore
