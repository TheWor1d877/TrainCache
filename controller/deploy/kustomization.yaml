# Root deployment kustomization for the TrainCache control plane.
#
#   kubectl apply -k controller/deploy
#
# The webhook Deployment expects the TLS Secret traincache-webhook-tls in the
# traincache namespace (e2e/run.sh creates it) and a CA bundle patched into the
# MutatingWebhookConfiguration before Pods are admitted.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../config/crd/bases
  - manager
  - webhook
  - agent
  - scheduler
# Kubernetes 1.37 rejects CRD schemas containing uniqueItems ("runtime
# complexity becomes quadratic"); older API server versions accepted it. The
# generated CRD (controller/config/crd/bases, from the +kubebuilder marker on
# PodDetail.InitialConsumeOrder) still carries it, so strip it at deploy time
# until the API type is migrated to x-kubernetes-list-type: set.
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: warmuptasks.traincache.io
    patch: |-
      - op: remove
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/podDetails/items/properties/initialConsumeOrder/uniqueItems
