# Root deployment kustomization for the TrainCache control plane.
#
#   kubectl apply -k controller/deploy
#
# The webhook Deployment expects the TLS Secret traincache-webhook-tls in the
# traincache namespace (e2e/run.sh creates it) and a CA bundle patched into the
# MutatingWebhookConfiguration before Pods are admitted.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../config/crd/bases
  - manager
  - webhook
  - agent
  - scheduler
  - gateway
# Dev builds tag every image `dev`. Release builds rewrite these five entries
# with `kustomize edit set image <name>=ghcr.io/thewor1d877/traincache/<comp>@sha256:<digest>`,
# so no tag or digest is ever hand-edited in the per-component manifests.
images:
  - name: ghcr.io/thewor1d877/traincache/controller-manager
    digest: sha256:83379abea8b056c3e57706e885188ca86667eeed6c8be722b327d295da5f3483
  - name: ghcr.io/thewor1d877/traincache/webhook
    digest: sha256:62c6d54852eb5361ba1aad7a1e73322ef3647c7c6c526d912706b880d7242c3a
  - name: ghcr.io/thewor1d877/traincache/kube-scheduler
    digest: sha256:190f3fe5c524beab4373ddeba4c41903b5d716a7f34785a6df645624aa85c9bd
  - name: ghcr.io/thewor1d877/traincache/traincache-agentd
    digest: sha256:7d9ec161688f62c1d122cc3757fb296109b536bbb772f21acb4ee099ed3dff3c
  - name: ghcr.io/thewor1d877/traincache/traincache-gateway
    digest: sha256:66ed74ee3b1bc540c79c758389b61b7fdb555916229e36ca7af34a0c6c4cbbc0
