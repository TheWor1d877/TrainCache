# controller-manager Deployment (single replica by default, docs/7.2 Q10).
#
# Watches all namespaces: DataSet/WarmupTask and the Pods selected by
# traincache.io/warmup=enabled (DegradedReconciler). The Agent is discovered
# through app=traincache-agentd Pods on each candidate Node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traincache-controller-manager
  namespace: traincache
  labels:
    app.kubernetes.io/name: traincache-controller-manager
    app.kubernetes.io/part-of: traincache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traincache-controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traincache-controller-manager
    spec:
      serviceAccountName: traincache-controller-manager
      priorityClassName: system-cluster-critical
      containers:
        - name: manager
          image: ghcr.io/thewor1d877/traincache/controller-manager:dev
          imagePullPolicy: IfNotPresent
          env:
            # No literal values here. Values equal to the defaults in
            # controller/internal/config/config.go (metrics :9412, health
            # :8081, namespace "", agent port 9410, agent timeout 5s, score
            # annotation traincache.io/node-scores, gate
            # traincache.io/warmup, leader election off, max chunks 10000000,
            # log level info) are written nowhere; the two values that override
            # a default come from traincache-config.
            - name: CONTROLLER_POLL_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: traincache-config
                  key: controllerPollInterval
            - name: CONTROLLER_SCORE_TTL
              valueFrom:
                configMapKeyRef:
                  name: traincache-config
                  key: controllerScoreTTL
            # K auto-default inputs, shared with the Agent through
            # traincache-config (D43). Missing keys block Pod startup.
            - name: TRAINCACHE_CACHE_CAPACITY_BYTES
              valueFrom:
                configMapKeyRef:
                  name: traincache-config
                  key: cacheCapacityBytes
            - name: TRAINCACHE_STARTUP_WINDOW_BYTES
              valueFrom:
                configMapKeyRef:
                  name: traincache-config
                  key: startupWindowBytes
            - name: TRAINCACHE_MAX_FILL_FRACTION
              valueFrom:
                configMapKeyRef:
                  name: traincache-config
                  key: maxFillFraction
          ports:
            - name: metrics
              containerPort: 9412
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
