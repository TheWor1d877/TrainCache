# Grafana 三层看板。JSON 以 ConfigMap 挂载到 /var/lib/grafana/dashboards,
# 由 dashboards-provisioning 里的 provider 加载,不烘进镜像。
# 面板查询全部使用代码中真实的 family 名(agent/metrics、controller/internal/metrics)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: traincache
data:
  control-plane.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "门控任务按状态",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (state) (traincache_controller_gate_tasks)",
              "legendFormat": "{{state}}",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "门控 Hold 时长 p90",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.9, sum by (le) (rate(traincache_controller_gate_hold_duration_seconds_bucket[30m])))",
              "legendFormat": "p90",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
