# Pod gate-injection webhook (docs/7.1-design.md《Webhook 注入》, docs/7.2 D9).
#
# caBundle is intentionally empty in the static manifest: the operator (or
# e2e/run.sh) injects the serving CA after creating traincache-webhook-tls.
# With failurePolicy=Ignore an unpatched bundle only makes injection a no-op.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: traincache-pod-warmup
  labels:
    app.kubernetes.io/name: traincache-webhook
    app.kubernetes.io/part-of: traincache
webhooks:
  - name: pods.traincache.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    matchPolicy: Equivalent
    timeoutSeconds: 5
    reinvocationPolicy: Never
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: "*"
    objectSelector:
      matchLabels:
        traincache.io/warmup: enabled
    clientConfig:
      service:
        namespace: traincache
        name: traincache-webhook
        path: /mutate-v1-pod
        port: 443
      caBundle: ""
  # Checkpoint sidecar injection (docs/10.1 §4.2). This rule rejects Pods that
  # opt in but cannot be resolved, so its failurePolicy is Fail.
  - name: pods-checkpoint.traincache.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    reinvocationPolicy: Never
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: "*"
    objectSelector:
      # 只匹配键是否存在（D24）：traincache.io/checkpoint 的值是每个任务的
      # ConfigMap 名，不可枚举，限定取值会让写错值的 Pod 静默绕过 webhook。
      # 键存在即进准入，值的合法性与 ConfigMap 是否存在由准入判、写错即拒绝。
      matchExpressions:
        - key: traincache.io/checkpoint
          operator: Exists
    clientConfig:
      service:
        namespace: traincache
        name: traincache-webhook
        path: /mutate-checkpoint
        port: 443
      caBundle: ""
