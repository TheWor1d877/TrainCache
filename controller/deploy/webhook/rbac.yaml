# The mutating webhook reads WarmupTasks, ConfigMaps and Jobs, and patches
# WarmupTask status when it records GateInjectionDegraded. It never reads
# Secrets: checkpoint credentials are injected as secretKeyRef references.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traincache-webhook
  namespace: traincache
  labels:
    app.kubernetes.io/name: traincache-webhook
    app.kubernetes.io/part-of: traincache
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traincache-webhook
  labels:
    app.kubernetes.io/name: traincache-webhook
rules:
  - apiGroups: ["traincache.io"]
    resources: ["warmuptasks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traincache.io"]
    resources: ["warmuptasks/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traincache-webhook
  labels:
    app.kubernetes.io/name: traincache-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traincache-webhook
subjects:
  - kind: ServiceAccount
    name: traincache-webhook
    namespace: traincache
