# Runtime parameters shared by the Agent, gateway, controller-manager and
# scheduler.
#
# Placement rule for every TrainCache setting (docs/PARAMETER-CONFIGURATION.md):
#
#   credentials                 -> Secret traincache-objstore, via secretKeyRef
#   per-node identity           -> Downward API fieldRef (NODE_NAME)
#   changes with cluster or run -> this ConfigMap, via configMapKeyRef
#   overrides a code default, rarely changes -> this ConfigMap too, so that no
#                                  workload manifest carries a private value
#   equals the code default     -> written nowhere; the default lives only in
#                                  agent/svc/config.go and
#                                  controller/internal/config/config.go
#
# Workload manifests therefore hold no literal `value:` env entries at all.
# Every key referenced by a configMapKeyRef must exist here: a missing key
# blocks Pod startup (CreateContainerConfigError) instead of silently falling
# back to a default.
#
#   cacheCapacityBytes       — Agent cache byte cap; "0" disables the byte
#                              dimension, leaving the disk watermark as the only
#                              eviction trigger. Read by Agent and Controller.
#   prefetchLookahead        — neighbour blocks prefetched ahead of the cursor.
#   evictPolicy              — eviction order: heat / lru / lfu.
#   datasetMetricsWhitelist  — comma-separated DataSet names that keep their own
#                              metrics label; "" merges every DataSet into the
#                              "other" label (bounded cardinality, D35).
#   startupWindowBytes       — Controller-only startup window used to derive K:
#                              K_window = ceil(startupWindowBytes / chunkSize).
#   maxFillFraction          — Controller-only share of cacheCapacityBytes that
#                              all Pods' preheat windows may occupy (D43).
#   objstoreEndpoint         — S3-compatible origin the Agent dials. Cluster
#                              local MinIO here; COS/OSS/S3 in a real cluster.
#   objstoreBucket           — the bucket holding the published datasets. Must
#                              equal DataSet.spec.bucket: SubmitPreheat carries
#                              no bucket field, so a mismatch fails every block
#                              read. The bench harness rewrites it per dataset.
#   objstoreSecure           — "true"/"1"/"yes" enables TLS to the origin;
#                              anything else, including "", means plain HTTP.
#   gatewayEndpoint          — S3 gateway the Agent routes block GETs to. ""
#                              means every block GET goes straight to the
#                              origin; "<host>:<port>" routes them through the
#                              gateway.
#   gatewaySecure            — "true"/"1"/"yes" enables TLS from the Agent to
#                              the gateway; independent of objstoreSecure.
#   gatewayBucketConcurrency — Gateway-only cap on concurrent downloads from
#                              the origin for the bucket; positive integer.
#                              Changing it restarts the gateway Deployment.
#   gatewayBlockBufferBytes  — Gateway-only size in bytes of the ring buffer
#                              held per in-flight block; positive integer.
#                              Changing it restarts the gateway Deployment.
#   controllerPollInterval   — WarmupTask progress poll interval. The code
#                              default is 2s; 1s keeps gate release latency
#                              inside the bench measurement window.
#   controllerScoreTTL       — TTL of a node score entry as written by the
#                              Controller. Must match schedulerScoreTTL.
#   schedulerScoreTTL        — TTL of a score entry as read by the scheduler
#                              plugin. Must match controllerScoreTTL.
#   schedulerLogLevel        — scheduler verbosity; "debug" emits one
#                              "scheduler score" line per (pod,node) decision.
apiVersion: v1
kind: ConfigMap
metadata:
  name: traincache-config
  namespace: traincache
  labels:
    app.kubernetes.io/name: traincache-config
    app.kubernetes.io/part-of: traincache
data:
  cacheCapacityBytes: "0"
  prefetchLookahead: "16"
  evictPolicy: "heat"
  datasetMetricsWhitelist: ""
  startupWindowBytes: "536870912"
  maxFillFraction: "0.125"
  objstoreEndpoint: "minio.minio.svc.cluster.local:9000"
  objstoreBucket: "traincache"
  objstoreSecure: "false"
  gatewayEndpoint: ""
  gatewaySecure: "false"
  gatewayBucketConcurrency: "32"
  gatewayBlockBufferBytes: "10485760"
  controllerPollInterval: "1s"
  controllerScoreTTL: "10m"
  schedulerScoreTTL: "10m"
  schedulerLogLevel: "debug"
