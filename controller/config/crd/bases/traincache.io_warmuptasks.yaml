---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: warmuptasks.traincache.io
spec:
  group: traincache.io
  names:
    kind: WarmupTask
    listKind: WarmupTaskList
    plural: warmuptasks
    singular: warmuptask
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.gateDecision.state
      name: Gate
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WarmupTask is the schema for the warmuptasks API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WarmupTaskSpec is immutable in podCount and dataSetRef; all other fields may
              be updated. The controller never creates, deletes or scales Pods (D31).
            properties:
              affinity:
                description: Affinity is recorded for v1 and does not affect GWAA.
                enum:
                - Any
                - Pack
                - Spread
                type: string
              candidate:
                description: Candidate optionally configures candidate node filtering.
                properties:
                  ignoreNoSchedule:
                    description: IgnoreNoSchedule ignores the NoSchedule taint when
                      filtering candidates.
                    type: boolean
                  minFreeDiskBytes:
                    description: MinFreeDiskBytes is the minimum free disk required
                      on a candidate node.
                    format: int64
                    type: integer
                  requireReady:
                    description: RequireReady requires a candidate node to be Ready.
                    type: boolean
                required:
                - ignoreNoSchedule
                - requireReady
                type: object
              dataSetRef:
                description: DataSetRef points at a same-namespace DataSet.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: dataSetRef is immutable
                  rule: self == oldSelf
              gate:
                description: GatePolicy configures the three-condition gate.
                properties:
                  gapMin:
                    description: GapMin is the marginal-gain gap threshold, in [0,1].
                    maximum: 1
                    minimum: 0
                    type: number
                  minInterval:
                    description: MinInterval is the minimum slope sampling interval.
                    type: string
                  slopeMin:
                    description: SlopeMin is the marginal-gain slope threshold, fraction
                      per second.
                    type: number
                  tMax:
                    description: TMax is the absolute gate timeout.
                    type: string
                  threshold:
                    description: Threshold is the required ready fraction, in [0,1].
                    maximum: 1
                    minimum: 0
                    type: number
                required:
                - gapMin
                - minInterval
                - slopeMin
                - tMax
                - threshold
                type: object
              podCount:
                description: PodCount is the fixed number of training Pods.
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: podCount is immutable
                  rule: self == oldSelf
              podDetails:
                items:
                  description: PodDetail describes one training Pod's window and resources.
                  properties:
                    index:
                      description: Index is the Pod ordinal in 0..PodCount-1; it must
                        be dense.
                      format: int32
                      minimum: 0
                      type: integer
                    initialConsumeOrder:
                      description: |-
                        InitialConsumeOrder is the global chunk order. Empty means "use the
                        default split"; if any Pod's order is invalid the whole set falls back
                        to the default split (D29).
                      items:
                        format: int32
                        type: integer
                      type: array
                      uniqueItems: true
                    k:
                      description: K is this Pod's startup window length and scoring
                        plateau length.
                      format: int32
                      minimum: 1
                      type: integer
                    resources:
                      description: Resources are the Pod's requests, used for node
                        capacity filtering.
                      properties:
                        claims:
                          description: |-
                            Claims lists the names of resources, defined in spec.resourceClaims,
                            that are used by this container.

                            This field depends on the
                            DynamicResourceAllocation feature gate.

                            This field is immutable. It can only be set for containers.
                          items:
                            description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                            properties:
                              name:
                                description: |-
                                  Name must match the name of one entry in pod.spec.resourceClaims of
                                  the Pod where this field is used. It makes that resource available
                                  inside a container.
                                type: string
                              request:
                                description: |-
                                  Request is the name chosen for a request in the referenced claim.
                                  If empty, everything from the claim is made available, otherwise
                                  only the result of this request.
                                type: string
                            required:
                            - name
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        limits:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: |-
                            Limits describes the maximum amount of compute resources allowed.
                            More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                          type: object
                        requests:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: |-
                            Requests describes the minimum amount of compute resources required.
                            If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                            otherwise to an implementation-defined value. Requests cannot exceed Limits.
                            More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                          type: object
                      type: object
                  required:
                  - index
                  - k
                  - resources
                  type: object
                type: array
              score:
                description: |-
                  ScorePolicy configures the global decay score. There is no window field:
                  each Pod's K is the single window (D25).
                properties:
                  cutoff:
                    description: Cutoff is C, the truncation distance in chunks.
                    format: int32
                    minimum: 0
                    type: integer
                  halfLife:
                    description: HalfLife is H, the decay half-life in chunks.
                    minimum: 0
                    type: number
                required:
                - cutoff
                - halfLife
                type: object
              targetRef:
                description: TargetRef identifies the workload whose Pods this WarmupTask
                  preheats.
                properties:
                  apiVersion:
                    description: APIVersion is the target workload's API version.
                    minLength: 1
                    type: string
                  kind:
                    description: Kind is Job, StatefulSet or Pod.
                    enum:
                    - Job
                    - StatefulSet
                    - Pod
                    type: string
                  name:
                    description: Name is the target workload name.
                    minLength: 1
                    type: string
                  podLabelSelector:
                    description: PodLabelSelector optionally selects the target Pods.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - apiVersion
                - kind
                - name
                type: object
              trainingType:
                description: TrainingType is the training phase the task is prepared
                  for.
                enum:
                - epoch
                - shuffle
                - curriculum
                - static
                type: string
            required:
            - dataSetRef
            - gate
            - podCount
            - podDetails
            - score
            - targetRef
            - trainingType
            type: object
          status:
            description: WarmupTaskStatus is written by the WarmupTask controller
              only.
            properties:
              candidateNodes:
                description: |-
                  CandidateNodes is the stable, ascending node list and the readiness-table
                  column order.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consumeOrderSource:
                description: ConsumeOrderSource is Spec or Default.
                enum:
                - Spec
                - Default
                type: string
              gateDecision:
                description: GateDecision is the frozen gate verdict.
                properties:
                  decidedAt:
                    format: date-time
                    type: string
                  podRates:
                    items:
                      description: PodRate is one Pod's marginal-gain observation
                        at gate time.
                      properties:
                        gap:
                          type: number
                        podIndex:
                          format: int32
                          type: integer
                        rate:
                          type: number
                        slope:
                          type: number
                      required:
                      - gap
                      - podIndex
                      - rate
                      - slope
                      type: object
                    type: array
                  reason:
                    type: string
                  state:
                    description: GateState is the gate decision.
                    enum:
                    - Hold
                    - Released
                    - Degraded
                    type: string
                type: object
              lastUpdated:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: WarmupPhase is the WarmupTask lifecycle phase.
                enum:
                - Pending
                - Filtering
                - Preheating
                - Gating
                - Released
                - Degraded
                - Failed
                type: string
              podNodeReadiness:
                items:
                  description: PodNodeReadiness is one Pod's readiness fact on one
                    candidate node.
                  properties:
                    actualNode:
                      type: string
                    assignedNode:
                      type: string
                    globalDecayScore:
                      format: int32
                      type: integer
                    lastReportTime:
                      format: date-time
                      type: string
                    nodeName:
                      description: NodeName is the candidate node this readiness fact
                        was collected on.
                      type: string
                    podIndex:
                      format: int32
                      type: integer
                    podName:
                      type: string
                    readyBlockBitmap:
                      description: |-
                        ReadyBlockBitmap is the per-request-chunk readiness bitmap reported by
                        the Agent (bit i == submitted chunks[i]); 1 means persisted and verified.
                      format: byte
                      type: string
                    readyInWindow:
                      description: ReadyInWindow mirrors StartupWindowReady for the
                        8.1 gate contract.
                      format: int32
                      type: integer
                    requiredReady:
                      format: int32
                      type: integer
                    startupWindowReady:
                      description: StartupWindowReady is the ready-block count inside
                        the startup window.
                      format: int32
                      type: integer
                    startupWindowReadyRate:
                      type: number
                    state:
                      description: PreheatState is the per-(pod,node) preheat state.
                      enum:
                      - Preheating
                      - Ready
                      - Stopped
                      - Failed
                      type: string
                  required:
                  - podIndex
                  type: object
                type: array
              readinessTable:
                description: ReadinessTable is P x N window ready-block counts (not
                  ratios).
                items:
                  items:
                    format: int32
                    type: integer
                  type: array
                type: array
              startedAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
