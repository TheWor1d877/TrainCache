# Two training Pods, 8-chunk startup window each. threshold=0.9 requires 7 of
# 8 ready blocks, so the Pods stay gated long enough for the webhook assertion
# while the preheat is genuinely exercised.
apiVersion: traincache.io/v1alpha1
kind: WarmupTask
metadata:
  name: train-task
  namespace: traincache-e2e
spec:
  dataSetRef:
    name: train-data
  targetRef:
    apiVersion: batch/v1
    kind: Job
    name: train-job
  podCount: 2
  # One preheat Node per Pod. GWAA fits a single placement unit per Node, so
  # with the two labelled candidates the CRD default of 2 lets the first Pod
  # claim both Nodes and starves the second (MinUnmet, never preheated); the
  # train-job nodeAffinity also needs each Pod warm on exactly one Node to make
  # the NodeDeviation landing deterministic.
  preheatFanout: 1
  preheatFanoutMin: 1
  affinity: Any
  trainingType: static
  podDetails:
    - index: 0
      k: 8
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
    - index: 1
      k: 8
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
  gate:
    threshold: 0.9
    gapMin: 0.1
    slopeMin: 0.001
    tMax: 5m
    minInterval: 1s
  score:
    halfLife: 4
    cutoff: 8
  candidate:
    requireReady: true
    ignoreNoSchedule: false
