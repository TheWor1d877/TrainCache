# Indexed Job creates Pods labelled traincache.io/warmup=enabled, so the
# mutating webhook injects the scheduling gate and task/pod-index annotations.
# schedulerName opts these Pods into the custom TrainCache scheduler.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-job
  namespace: traincache-e2e
  labels:
    app: traincache-train
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: traincache-train
        traincache.io/warmup: enabled
    spec:
      schedulerName: traincache-scheduler
      restartPolicy: Never
      # GWAA's candidate set is the two s3-access-labelled workers (worker and
      # worker2), so the two Pods are assigned to those Nodes in some order.
      # Pinning both Pods to worker2/worker3 means the Pod assigned to "worker"
      # must land elsewhere, producing a deterministic NodeDeviation, while
      # every Pod still has two feasible Nodes (kube-scheduler skips score
      # plugins when a Pod has only one feasible Node).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["traincache-e2e-worker2", "traincache-e2e-worker3"]
      containers:
        - name: trainer
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "echo pod-index=$JOB_COMPLETION_INDEX; sleep 1800"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
