# Training Pod that opts into checkpointing. The checkpointd sidecar is not
# written here: the Pod is admitted through the MutatingWebhookConfiguration
# and the webhook injects the sidecar, the volumes and the environment
# (design 10.1 §4.2). The e2e asserts that the injection happened by reading
# the admitted Pod back from the API server.
#
# The busybox trainer writes step-1/data.bin (1 MiB) and .done into the
# directory the webhook points TRAINCACHE_CHECKPOINT_DIR at, then sleeps. On
# the first Pod checkpointd uploads step 1; after the Pod is recreated the
# emptyDir is fresh, so the restored file proves the S3 round trip.
apiVersion: v1
kind: Pod
metadata:
  name: traincache-checkpoint-e2e
  namespace: traincache
  labels:
    app: traincache-checkpoint-e2e
    traincache.io/checkpoint: ckpt-config
  annotations:
    traincache.io/task-id: t1
    traincache.io/rank: "0"
    traincache.io/world-size: "1"
spec:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: trainer
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -eu
          # 组可写：checkpointd 以 65532 运行，删工作卷副本要能写 step 目录
          # （design 10.1 §4.3 权限）。
          umask 0002
          # 内容固定为 1 MiB 全零：恢复后的文件要和上传前逐字节一致，
          # 断言用 sha256 比对，不能用随机数据。
          mkdir -p "$TRAINCACHE_CHECKPOINT_DIR/step-1"
          dd if=/dev/zero of="$TRAINCACHE_CHECKPOINT_DIR/step-1/data.bin" bs=1048576 count=1 2>/dev/null
          sync
          touch "$TRAINCACHE_CHECKPOINT_DIR/step-1/.done"
          echo "trainer: wrote 1 MiB step-1/data.bin"
          sleep 3600
