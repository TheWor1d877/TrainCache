# bench 装置:kind 内 MinIO(层3 数据源),nodePort 30090 供宿主机上传
# 数据用 PVC(kind standard storageclass)持久化:rollout restart/换 Pod 不丢数据
# (2026-10-09 教训:无卷时重启丢光全部桶,含现勘 train-data)
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # 固定 release tag（R4）：不使用 latest，避免滚动升级带来行为漂移。
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: traincache
            - name: MINIO_ROOT_PASSWORD
              value: traincache-probe
            # 源站出站字节对账(9.2)需要宿主机匿名抓 metrics;默认鉴权会 403
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      nodePort: 30090
    - name: console
      port: 9001
      nodePort: 30091
