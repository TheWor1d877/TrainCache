# agentd.yaml — TrainCache 节点常驻 Agent 的 DaemonSet 部署清单(design 6.1 §8 部署要点,逐项对应)。
#
# 用法(kind 本机演练):
#   docker build -f agent/Dockerfile -t traincache-agentd:dev .    # GOPROXY 受限时加 build-arg
#   kind load docker-image traincache-agentd:dev --name traincache
#   kubectl apply -f agent/deploy/agentd.yaml
#
# §8 对照:镜像入口 traincache-agentd(镜像 ENTRYPOINT;单容器);hostPath 两个
# (/var/cache/traincache rw DirectoryOrCreate、/run/traincache rw DirectoryOrCreate);
# env 全表见 containers[].env;探针 liveness/readiness 见两 probe 段;资源 100m/1Gi 与
# 2C/4Gi 见 resources;安全 readOnlyRootFilesystem=true 见 securityContext(缓存目录写
# 权限 = hostPath + 以 root 运行[kubelet 以 root:root 建目录],镜像根文件系统全只读)。
apiVersion: v1
kind: Namespace
metadata:
  name: traincache
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: traincache-agentd
  namespace: traincache
  labels:
    app.kubernetes.io/name: traincache-agentd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traincache-agentd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traincache-agentd
    spec:
      # 每节点一个 Agent(§3/§8);"符合条件的缓存节点"经 nodeSelector/affinity 按集群
      # 容量规划收窄——本清单不设约束,toleration 也不加:实际落在全部可调度节点
      # (kind traincache 集群即两个 worker;control-plane 带 NoSchedule 污点被自然排除)。
      containers:
        - name: agentd
          image: traincache-agentd:dev
          imagePullPolicy: IfNotPresent
          env:
            # ---- 节点标识(D8:必填,启动校验非空)----
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # ---- 监听地址(D5:非特权端口)----
            - name: TRAINCACHE_GRPC_ADDR
              value: ":9410"
            - name: TRAINCACHE_METRICS_ADDR
              value: ":9411"
            # ---- 校验等级(§8:xxh3 | xxh3+sha256,透传 core verify_level)----
            - name: TRAINCACHE_VERIFY
              value: "xxh3"
            # ---- dataset 白名单(§5.8 基数控制:白名单外归并 other;按集群实际数据集改)----
            - name: TRAINCACHE_DATASET_WHITELIST
              value: "train-data"
            # ---- CAS 根(D38:默认值即本值;本机进程级演练可覆盖,DaemonSet 用默认)----
            - name: TRAINCACHE_CACHE_ROOT
              value: "/var/cache/traincache"
            # ---- 热度与磁盘触发线(D30 冻结 11 env;此处显式写默认值,按需覆盖)----
            - name: TRAINCACHE_HEAT_DECAY_AGE
              value: "24h"
            - name: TRAINCACHE_HEAT_DUMP_INTERVAL
              value: "30m"
            - name: TRAINCACHE_HEAT_DECAY_INTERVAL
              value: "24h"
            - name: TRAINCACHE_HEAT_DECAY_FACTOR
              value: "0.5"
            - name: TRAINCACHE_HEAT_OPEN_BETA
              value: "0.15"
            - name: TRAINCACHE_HEAT_TOUCH_HALF_LIFE
              value: "6h"
            - name: TRAINCACHE_HEAT_CALIBRATE_WINDOW
              value: "100"
            - name: TRAINCACHE_HEAT_CALIBRATE_THRESHOLD
              value: "0.8"
            - name: TRAINCACHE_HEAT_DISK_TRIGGER_PERCENT
              value: "80"
            - name: TRAINCACHE_HEAT_DISK_DELTA_PERCENT
              value: "5"
            - name: TRAINCACHE_HEAT_DISK_CRITICAL_PERCENT
              value: "90"
            # ---- 对象存储(D26:endpoint 默认 127.0.0.1:9000 = 节点内 MinIO 边车约定;
            #      走真实对象存储时改 endpoint 与凭据,凭据建议改引 Secret)----
            - name: TRAINCACHE_OBJSTORE_ENDPOINT
              value: "127.0.0.1:9000"
            - name: TRAINCACHE_OBJSTORE_ACCESS_KEY
              value: "traincache"
            - name: TRAINCACHE_OBJSTORE_SECRET_KEY
              value: "traincache-probe"
            - name: TRAINCACHE_OBJSTORE_BUCKET
              value: "traincache"
            - name: TRAINCACHE_OBJSTORE_SECURE
              value: "false"
          ports:
            - name: grpc
              containerPort: 9410
            - name: metrics
              containerPort: 9411
          # 探针(§8):镜像内自带 traincache CLI(纯 gRPC 客户端,默认 --endpoint
          # 127.0.0.1:9410),不依赖宿主机 grpcurl。
          # liveness = gRPC 健康:GetNodeStatus(--item agent)成功即退出码 0;
          # readiness = GetNodeStatus(--item rescan)成功 且 rescan.phase != SAMPLING
          #   (§7.1:抽样完成先服务,后台全量扫描进行中不影响 ready)。
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  traincache node status --node "$NODE_NAME" --item agent
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  out="$(traincache node status --node "$NODE_NAME" --item rescan)" || exit 1;
                  echo "$out" | grep -q '^RESCAN_PHASE' || exit 1;
                  echo "$out" | grep -q 'SAMPLING' && exit 1;
                  exit 0
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # 资源(§8 示例口径:request 100m/1Gi,limit 2C/4Gi;bench 装置校准后可调)
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/traincache
            - name: run
              mountPath: /run/traincache
      volumes:
        - name: cache
          hostPath:
            path: /var/cache/traincache
            type: DirectoryOrCreate
        - name: run
          hostPath:
            path: /run/traincache
            type: DirectoryOrCreate
